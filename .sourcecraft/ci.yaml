on:
  push:
    workflows: build-site
    filter:
      branches: main

workflows:
  build-site:
    tasks:
      - name: build-site
        cubes:
          - name: publish-site
            script:
              - git checkout -B release
              - git rm -rf --cached . || true
              - git checkout -- . || true
              - rm -f src/CNAME src/.nojekyll
              - rm -rf .github .sourcecraft
              - git add -A
              - "git commit -m 'feat: release'"
              - git push origin release -f
