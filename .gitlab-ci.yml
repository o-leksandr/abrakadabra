# filename: ./.gitlab-ci.yml
# date: 05.10.2026

stages: [update]

default:
  image: alpine:3.20

pull-activity:
  stage: update
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache curl unzip bash findutils jq sed git
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name  "GitLab CI"
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
  script:
    - bash scripts/pull_activity.sh
    - ls -la src/activity_graph.svg
    - git add src/activity_graph.svg
    - |
      if git diff --cached --quiet; then
        echo "no changes, skip commit"
      else
        git commit -m "chore: update activity_graph.svg [skip ci]"
        git push origin HEAD:${CI_COMMIT_BRANCH}
      fi
  artifacts:
    paths: [src/activity_graph.svg]
    expire_in: 30 days
